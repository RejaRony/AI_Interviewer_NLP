<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interviewer | Python & NLP Portfolio Project</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="chat-container">
        <header class="chat-header">
            <i class="fas fa-robot"></i>
            <h1>AI Interviewer</h1>
            <p class="tagline">Python & NLP Powered Mock Interview</p>
        </header>

        <main id="messageArea" class="chat-display">
            {% if initial_message %}
            <div class="message other initial-message initial-message-jinja">
                {{ initial_message | safe }}
            </div>
            {% endif %}
            
        </main>

        <footer class="input-area">
            <form id="message-form">
                <input type="text" id="messageInput" class="message-input" placeholder="Type your detailed answer here..." required>
                <button type="submit" id="sendButton" class="send-button">
                    <i class="fas fa-paper-plane"></i> Send Answer
                </button>
            </form>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
